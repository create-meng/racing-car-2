# ==============================================================================
# 适用于 OriginCar 阿克曼底盘的完整 Navigation2 核心配置文件 (MPPI 丝滑避障与狂飙版)
# 支持运行环境: ROS 2 Foxy / Humble 
# 完美适配上位机: RDK X5 (8GB) 算力降采样与阿克曼运动学约束
# 局部控制器: nav2_mppi_controller (模型预测路径积分控制)
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.4
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom_combined"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.02
    tf_broadcast: true
    # 不给 map->odom 未来发布 2 秒，避免过滤器和 costmap 请求到未来 TF。
    transform_tolerance: 0.3
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.7
    z_rand: 0.059
    z_short: 0.24
    scan_topic: /scan
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.1
    # h1 负责比赛路线节点确认；BT 只保留较小的底层完成容差。
    goal_reached_tol: 0.25
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom_combined
    bt_loop_duration: 50
    # BT action/service acknowledgement timeout in milliseconds. 20 ms is too
    # short for the first costmap clear and planner request on this platform.
    default_server_timeout: 1000
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/root/ros2_ws/src/racecar/config/navigate_through_poses_loop.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0           # 10Hz 控制频率 (周期 = 0.1s)
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.1
    odom_topic: odom_combined
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.14
      stateful: true

    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.22
      yaw_goal_tolerance: 3.14
      stateful: true

    # --------------------------------------------------------------------------
    # MPPI 局部运动学规划器参数块 - 高速全血狂飙版
    # --------------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      
      model_dt: 0.1                      # 每步预测时间对齐为 0.1s
      time_steps: 25                     # 预测前瞻步数降为 20 步
      
      batch_size: 800                    # 每次撒出的预测轨迹数
      # vx_std 收窄：速度采样集中到低速区，近障碍时最优轨迹自然减速
      # （近似“近障碍自动限速”），空旷段仍由 PathFollowCritic 拉到 vx_max。
      vx_std: 0.15                       
      vy_std: 0.0                        
      # wz_std 收窄：转向采样更平滑，减少高速大转向扫到贴路线锥桶。
      wz_std: 0.5                        
      vx_max: 0.55                       # 空旷段最高前向速度
      vx_min: -0.20                      # 保留倒车能力，同时限制正常倒车速度
      vy_max: 0.0
      wz_max: 1.0                        # 降低角速度，减少高速甩出路点
      ax_max: 0.8                        # 降低起步加速度
      ax_min: -0.8                       # 降低急刹造成的过冲
      az_max: 1.2                        # 限制转向加速度
      temperature: 0.3                   
      gamma: 0.015                       
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      visualize: false                   

      # 阿克曼运动学约束
      motion_model: "Ackermann"
      Ackermann:
        min_turning_r: 0.35              # 严格遵守底盘最小转弯半径

      # 权重打分评价器 (Critics)
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 5.0                 # 空旷段优先正向行驶，保留脱困倒车能力
        threshold_to_consider: 0.5
      ObstaclesCritic:
        # 0.1~0.25m 距离内排斥更强：转弯绕锥桶时更早远离，减少高速贴障。
        repulsion_weight: 40.0
        critical_weight: 80.0
        consider_footprint: true
        collision_cost: 10000.0          
        # 0.25m 开始规避：0.55m/s 下留出约 0.45s 反应时间（Ackermann 最小
        # 半径 0.35m 完成绕行所需时间），避免 0.12m 才反应导致"贴脸必撞"。
        collision_margin_distance: 0.25
        inflation_radius: 0.20
        cost_scaling_factor: 10.0
        near_goal_distance: 0.5
      PathAlignCritic:
        cost_power: 1
        # 4.5：轨迹与 Smac 路径对齐约束增强——走廊里小偏差自动修正，
        # 避免 MPPI 因单侧贴障碍就“自由发挥”大转向掉出走廊。
        cost_weight: 4.5
        max_heuristic_dist: 1.5
      PathFollowCritic:
        cost_power: 1
        # 16：更坚定跟随规划路径（对应 y=4 走廊转角打多掉出走廊的问题）
        cost_weight: 16.0
        offset_from_furthest: 20
      PathAngleCritic:
        cost_power: 1
        cost_weight: 0.5
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.785

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05                                  
      footprint: "[ [-0.14, -0.11], [-0.14, 0.11], [0.14, 0.11], [0.14, -0.11] ]"
      # 局部控制也必须看到静态墙；激光层负责实时障碍，两者叠加。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 10.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 无回波束也用于清除旧动态障碍，避免锥桶/激光残影长期留在局部图。
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.01
      always_send_full_costmap: false

  local_costmap_client:
    ros__parameters:
      use_sim_time: false

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      use_sim_time: false
      rolling_window: false
      resolution: 0.05
      footprint: "[ [-0.14, -0.11], [-0.14, 0.11], [0.14, 0.11], [0.14, -0.11] ]"
      # 墙体来自静态图，动态锥桶由激光实时标记和清除，供全局重规划绕行。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 10.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 无回波束也用于清除旧动态障碍，避免全局图保留已离开的障碍。
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          # 只把车附近 2.5m 内的实时障碍写进 map 系；远处的动态障碍
          # 经 AMCL map->odom 变换误差大且信息过时，只会污染全局规划。
          obstacle_max_range: 2.5
          obstacle_min_range: 0.01

      always_send_full_costmap: true

  global_costmap_client:
    ros__parameters:
      use_sim_time: false

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased", "PreciseGridBased"]
    use_sim_time: false
    expected_planner_frequency: 5.0                     

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # 备用规划器也不能用大容差伪报路点成功；H1 的比赛完成半径是 0.30m。
      tolerance: 0.30
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # 3s：起步贴墙/卡点时搜索空间大，1s 内扩展不完会误报 no valid path；
      # 正常情况规划 <0.1s 完成，此上限只影响卡点。
      max_planning_time: 3.0                            
      motion_model_for_search: "REEDS_SHEPP"            # 允许倒车脱困
      cost_travel_multiplier: 2.5
      
      downsample_costmap: false                          
      downsampling_factor: 2                            
      angle_quantization_bins: 48                       

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # 1.2：正常仍以正车为主，但被障碍卡住时 Smac 愿意规划
      # “倒车→转向→前进”的完整脱困 maneuver（人开也是一把倒车拧过去）。
      reverse_penalty: 1.2
      non_straight_penalty: 30.0
      change_penalty: 20.0                              
      # 253 仍可穿（防卡死）；penalty 20 让“穿 0.3m 级缝”比“绕远 1-2m”
      # 更便宜，路径更直接（28 时路径为躲 253 宁可绕远，浪费时间）。
      cost_penalty: 20.0                                 
      
      cache_obstacle_heuristic: true
      max_steer_angle: 0.5236
      wheelbase: 0.189
      # 0.35 对齐底盘实际最小转弯半径（0.189/tan30°≈0.327，MPPI 已按 0.35 执行）。
      # Smac 用 0.40 会白白损失贴障碍起点的可规划空间，导致起点朝向
      # 与目标方向差大时规划失败；对齐后更容易规划出脱困路径。
      minimum_turning_radius: 0.35
      # 只把 254 真实障碍当不可通行；锥桶在 253 膨胀区内时仍能规划，
      # 避免“起点/通道被 253 判 lethal”导致 no valid path（issue #2457）。
      # 执行层 MPPI 仍按局部代价避障，安全性由 254 兜底。
      is_reverse_cost: true
      is_holonomic_cost: false
      is_collision_checking_cost: false

    PreciseGridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.30
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "REEDS_SHEPP"            # 允许倒车脱困
      cost_travel_multiplier: 2.5
      # 精确路线不能把 0.06m 激光栅格再合并为 0.12m；否则车侧的近障碍
      # 会被放大到车体内，Smac 会把本可通行的起点误判为 lethal。
      downsample_costmap: false
      angle_quantization_bins: 48
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 1.2
      non_straight_penalty: 30.0
      change_penalty: 20.0
      # 同 GridBased：253 可穿、路径更直接、优先绕开 254 真实障碍。
      cost_penalty: 20.0
      cache_obstacle_heuristic: true
      max_steer_angle: 0.5236
      wheelbase: 0.189
      # 0.35 对齐底盘实际最小转弯半径（0.189/tan30°≈0.327，MPPI 已按 0.35 执行）。
      # Smac 用 0.40 会白白损失贴障碍起点的可规划空间，导致起点朝向
      # 与目标方向差大时规划失败；对齐后更容易规划出脱困路径。
      minimum_turning_radius: 0.35
      is_reverse_cost: true
      is_holonomic_cost: false
      is_collision_checking_cost: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"] 

    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    spin:
      plugin: "nav2_behaviors/Spin"

    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 5.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false                             
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # 因为你已在上层导航执行脚本中精确控制了仅在路线的第1和第4个点停靠，这里保持 false 避免干扰
      enabled: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 【全面放大平滑漏斗】匹配局部控制器的极限冲刺与倒车
    max_velocity: [0.55, 0.0, 1.2]
    min_velocity: [-0.20, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.2]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
