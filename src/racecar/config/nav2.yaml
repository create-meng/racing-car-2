# ==============================================================================
# 适用于 OriginCar 阿克曼底盘的完整 Navigation2 核心配置文件 (MPPI 丝滑避障与狂飙版)
# 支持运行环境: ROS 2 Foxy / Humble 
# 完美适配上位机: RDK X5 (8GB) 算力降采样与阿克曼运动学约束
# 局部控制器: nav2_mppi_controller (模型预测路径积分控制)
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.4
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom_combined"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.02
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.7
    z_rand: 0.059
    z_short: 0.24
    scan_topic: /scan
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.1
    goal_reached_tol: 0.4
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom_combined
    bt_loop_duration: 50
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0           # 10Hz 控制频率 (周期 = 0.1s)
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.1
    odom_topic: odom_combined
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.8
      stateful: true

    # --------------------------------------------------------------------------
    # MPPI 局部运动学规划器参数块 - 高速全血狂飙版
    # --------------------------------------------------------------------------
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      
      model_dt: 0.1                      # 每步预测时间对齐为 0.1s
      time_steps: 20                     # 预测前瞻步数降为 20 步
      
      batch_size: 800                    # 每次撒出的预测轨迹数
      vx_std: 0.85                        
      vy_std: 0.0                        
      wz_std: 1.4                        
      vx_max: 0.85                        # 【猛踩油门】最大线速度提升至 1.5 m/s
      vx_min: -0.6                       # 【倒车动力】保障小车有足够的倒车速度
      vy_max: 0.0
      wz_max: 2.0                        # 【敏捷转向】最大角速度提升至 1.5
      ax_max: 2.5                        # 【推背感】提升起步加速度
      ax_min: -2.5                       # 【急刹车】增强刹车制动力度
      az_max: 4                        # 【快速回正】提升转向加速度
      temperature: 0.3                   
      gamma: 0.015                       
      iteration_count: 1
      prune_distance: 1.7                
      transform_tolerance: 0.1
      visualize: false                   

      # 阿克曼运动学约束
      motion_model: "Ackermann"
      Ackermann:
        min_turning_r: 0.35              # 严格遵守底盘最小转弯半径

      # 权重打分评价器 (Critics)
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 0.1                 # 【解除倒车封印】极低的前进偏好，允许自由倒车
      ObstaclesCritic:
        repulsion_weight: 5.0            
        critical_weight: 20.0            
        consider_footprint: true
        collision_cost: 10000.0          
        collision_margin_distance: 0.09  
        near_goal_distance: 0.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 1.0                
        max_heuristic_dist: 1.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 20
      PathAngleCritic:
        cost_power: 1
        cost_weight: 0.5
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.785

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05                                  
      robot_radius: 0.15
      footprint: "[ [-0.15, -0.10], [-0.15, 0.10], [0.25, 0.10], [0.25, -0.10] ]"
      plugins: ["obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4                          
        cost_scaling_factor: 12.0                        

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.01
      always_send_full_costmap: false

  local_costmap_client:
    ros__parameters:
      use_sim_time: false

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0                             
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: false
      resolution: 0.06
      robot_radius: 0.15
      footprint: "[ [-0.15, -0.10], [-0.15, 0.10], [0.25, 0.10], [0.25, -0.10] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] 

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4                          
        cost_scaling_factor: 12.0                        

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1
      always_send_full_costmap: true

  global_costmap_client:
    ros__parameters:
      use_sim_time: false

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: false
    expected_planner_frequency: 5.0                     

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.0
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0                            
      motion_model_for_search: "REEDS_SHEPP"            
      cost_travel_multiplier: 2.0
      
      downsample_costmap: true                          
      downsampling_factor: 2                            
      angle_quantization_bins: 48                       

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.6                       
      reverse_penalty: 1.0                               # 【降低倒车惩罚】允许全局地图生成向后的绿线
      non_straight_penalty: 30.0
      change_penalty: 20.0                              
      cost_penalty: 18.0                                 
      
      cache_obstacle_heuristic: true
      max_steer_angle: 0.5236
      wheelbase: 0.3
      turn_radius: 1.2
      is_reverse_cost: true
      is_holonomic_cost: false
      is_collision_checking_cost: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"] 

    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 5.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false                             
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # 因为你已在上层导航执行脚本中精确控制了仅在路线的第1和第4个点停靠，这里保持 false 避免干扰
      enabled: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 【全面放大平滑漏斗】匹配局部控制器的极限冲刺与倒车
    max_velocity: [1.2, 0.0, 3.0]
    min_velocity: [-0.6, 0.0, -2.0]
    max_accel: [2.5, 0.0, 4.0]
    max_decel: [-2.5, 0.0, -4.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]